<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Connections KC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #f7faf8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      text-align: center;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 900;
      color: #22b14c;
      margin-bottom: 8px;
    }
    h1 { font-size: 1.5rem; font-weight: 900; color: #1a2e1e; margin-bottom: 32px; }
    label { display: block; font-weight: 700; font-size: 0.9rem; color: #1a2e1e; text-align: left; margin-bottom: 6px; }
    input {
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a2e1e;
      background: #f7faf8;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input:focus { border-color: #22b14c; background: #fff; }
    button {
      width: 100%;
      padding: 15px;
      background: #22b14c;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      border: none;
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    button:hover { background: #1a9040; transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: default; transform: none; }
    .status {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      display: none;
    }
    .status.success { background: #e6f7ed; color: #1a9040; display: block; }
    .status.error   { background: #fdecea; color: #c0392b; display: block; }
    .current { font-size: 0.88rem; color: #6b8a73; margin-bottom: 24px; }
    .current span { font-weight: 800; color: #22b14c; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <div class="logo">Connections KC</div>
    <h1>Admin</h1>
    <label for="pwd">Password</label>
    <input type="password" id="pwd" placeholder="Enter password" />
    <button onclick="checkPassword()">Enter</button>
    <div class="status error" id="loginError">Wrong password.</div>
  </div>

  <!-- PANEL -->
  <div class="card" id="panel" style="display:none">
    <div class="logo">Connections KC</div>
    <h1>Update Impact Total</h1>
    <p class="current">Current value on site: <span id="currentVal">loading...</span></p>
    <label for="newTotal">New Dollar Amount</label>
    <input type="number" id="newTotal" placeholder="e.g. 1450" min="0" />
    <button id="saveBtn" onclick="save()">Save to Website</button>
    <div class="status" id="saveStatus"></div>
  </div>

  <script>
    // ─── CONFIG ──────────────────────────────────────────
    const PASSWORD    = 'ADMIN_PASSWORD';       // Replace with a password you choose
    const GITHUB_TOKEN = 'GITHUB_TOKEN';        // Replace with your GitHub fine-grained token
    const REPO        = 'viaate/connectionskc';
    const BRANCH      = 'claude/connections-kc-website-FFtpl';
    const FILE_PATH   = 'impact.json';
    // ─────────────────────────────────────────────────────

    function checkPassword() {
      if (document.getElementById('pwd').value === PASSWORD) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        loadCurrent();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkPassword();
    });

    function loadCurrent() {
      fetch(`/impact.json?nocache=${Date.now()}`)
        .then(r => r.json())
        .then(d => {
          document.getElementById('currentVal').textContent = '$' + (d.total || 0).toLocaleString();
          document.getElementById('newTotal').value = d.total || '';
        })
        .catch(() => {
          document.getElementById('currentVal').textContent = 'unknown';
        });
    }

    async function save() {
      const total = parseInt(document.getElementById('newTotal').value, 10);
      if (isNaN(total) || total < 0) {
        showStatus('Please enter a valid dollar amount.', 'error');
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        // Get current file SHA (required by GitHub API to update a file)
        const getRes = await fetch(
          `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}`,
          { headers: { Authorization: `Bearer ${GITHUB_TOKEN}` } }
        );
        if (!getRes.ok) throw new Error('Could not read file from GitHub.');
        const fileData = await getRes.json();

        // Update the file
        const newContent = btoa(`{ "total": ${total} }\n`);
        const putRes = await fetch(
          `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`,
          {
            method: 'PUT',
            headers: {
              Authorization: `Bearer ${GITHUB_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Update impact total to $${total.toLocaleString()}`,
              content: newContent,
              sha: fileData.sha,
              branch: BRANCH
            })
          }
        );
        if (!putRes.ok) throw new Error('GitHub rejected the update.');

        showStatus(`Saved! The site will show $${total.toLocaleString()} within a minute.`, 'success');
        document.getElementById('currentVal').textContent = '$' + total.toLocaleString();
      } catch (err) {
        showStatus('Error: ' + err.message, 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Save to Website';
    }

    function showStatus(msg, type) {
      const el = document.getElementById('saveStatus');
      el.textContent = msg;
      el.className = `status ${type}`;
    }
  </script>
</body>
</html>
