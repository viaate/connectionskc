<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Green background -->
  <rect width="100" height="100" fill="#22b14c"/>
  <!-- Top face of box -->
  <polygon points="20,16 76,16 88,7 32,7" fill="#2a2a2a"/>
  <!-- Right side face -->
  <polygon points="76,16 88,7 88,87 76,94" fill="#383838"/>
  <!-- Front face -->
  <rect x="20" y="16" width="56" height="78" rx="1" fill="#111111"/>
  <!-- Left eye (short tick) -->
  <line x1="36" y1="38" x2="36" y2="45" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right eye (dot) -->
  <circle cx="51" cy="40" r="2" fill="white"/>
  <!-- Smile — wide U curve -->
  <path d="M 29 54 C 29 74 67 74 67 54" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
